# OPTIONAL input fragment. Merge AFTER existing Kitty includes; do not replace kitty.conf.
# Native feedback for both URLs and OSC 8 labels; Ctrl additionally previews the target.
# Hover feedback does not grant plain-click activation.
detect_urls yes
underline_hyperlinks hover
url_style straight
show_hyperlink_targets ctrl

# Only Ctrl+left-click opens links (HTTP(S) and local file hyperlinks alike).
# Fullscreen Pi owns grabbed clicks; its ALPS patch enforces the same policy.
mouse_map ctrl+left press grabbed no_op
mouse_map ctrl+left release grabbed no_op
mouse_map ctrl+left press ungrabbed discard_event
mouse_map ctrl+left release ungrabbed mouse_handle_click link

# Preserve selection / shell prompt movement, but remove every default link opener.
mouse_map left click ungrabbed mouse_handle_click selection prompt
mouse_map shift+left click grabbed,ungrabbed mouse_handle_click selection prompt
mouse_map ctrl+shift+left press grabbed no_op
mouse_map ctrl+shift+left release grabbed,ungrabbed no_op
# SGR mouse reports cannot reliably distinguish Super from plain Ctrl.
# Swallow every Ctrl+Super chord here rather than letting it reach Pi.
mouse_map ctrl+super+left press grabbed,ungrabbed discard_event
mouse_map ctrl+super+left release grabbed,ungrabbed discard_event
mouse_map ctrl+shift+super+left press grabbed,ungrabbed discard_event
mouse_map ctrl+shift+super+left release grabbed,ungrabbed discard_event
mouse_map ctrl+alt+super+left press grabbed,ungrabbed discard_event
mouse_map ctrl+alt+super+left release grabbed,ungrabbed discard_event
mouse_map ctrl+alt+shift+super+left press grabbed,ungrabbed discard_event
mouse_map ctrl+alt+shift+super+left release grabbed,ungrabbed discard_event

# Let Pi receive Ctrl+V (its image-paste shortcut). Use Ctrl+Shift+V for terminal paste.
map ctrl+v no_op
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+c copy_to_clipboard

# This fragment does not change the shell, colors, desktop or system-wide mouse bindings.
