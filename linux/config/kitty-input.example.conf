# OPTIONAL input fragment. Merge AFTER existing Kitty includes; do not replace kitty.conf.
# Keep normal left-click for TUI interactions / selection.
# Also works while Pi captures mouse events. Kitty's default Ctrl+Shift+click remains.
mouse_map ctrl+left press grabbed,ungrabbed discard_event
mouse_map ctrl+left release grabbed,ungrabbed mouse_handle_click link

# Let Pi receive Ctrl+V (its image-paste shortcut). Use Ctrl+Shift+V for terminal paste.
map ctrl+v no_op
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+c copy_to_clipboard

# This fragment does not change the shell, colors, desktop or system-wide mouse bindings.
